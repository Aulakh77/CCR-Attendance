<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCR Sports Academy Attendance - Rupawas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 450px; background: white; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; }
        .box { background: #e9ecef; padding: 15px; margin: 15px 0; border-radius: 8px; text-align: left; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        #statusMessage { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>CCR Sports Academy</h2>
    <p>रूपावास (सिरसा)</p>
    
    <div class="box">
        <label><b>खिलाड़ी का नाम:</b></label>
        <input type="text" id="playerName" placeholder="पूरा नाम लिखें">

        <label><b>खेल (Sport):</b></label>
        <select id="sportCategory">
            <option value="Volleyball">वॉलीबॉल (Volleyball)</option>
            <option value="Athletics">एथलेटिक्स (Athletics)</option>
        </select>

        <label><b>शिफ्ट (Shift):</b></label>
        <select id="shiftType" disabled>
            <option value="Morning">सुबह की शिफ्ट (Morning)</option>
            <option value="Evening">शाम की शिफ्ट (Evening)</option>
        </select>

        <label><b>खिलाड़ी की फोटो (ग्राउंड पर):</b></label>
        <input type="file" id="playerPhoto" accept="image/*" capture="environment">
    </div>

    <button onclick="markAttendance()">हाजरी दर्ज करें</button>
    <p id="statusMessage"></p>
</div>

<script>
    // ऑटोमैटिक टाइम के हिसाब से शिफ्ट सेट करना (दोपहर 12 बजे तक Morning, बाद में Evening)
    function checkShift() {
        const now = new Date();
        const hours = now.getHours();
        const shiftSelect = document.getElementById("shiftType");
        
        if (hours < 12) {
            shiftSelect.value = "Morning";
        } else {
            shiftSelect.value = "Evening";
        }
    }
    checkShift();

    function markAttendance() {
        const name = document.getElementById("playerName").value.trim();
        const sport = document.getElementById("sportCategory").value;
        const shift = document.getElementById("shiftType").value;
        const photo = document.getElementById("playerPhoto").files[0];
        const status = document.getElementById("statusMessage");

        if (!name) {
            status.style.color = "red";
            status.innerText = "कृपया खिलाड़ी का नाम दर्ज करें!";
            return;
        }

        if (!photo) {
            status.style.color = "red";
            status.innerText = "कृपया अपनी फोटो अपलोड करें!";
            return;
        }

        const now = new Date();
        const hours = now.getHours();

        // वैलिडेट करना (Morning 12 बजे तक, Evening रात 12 बजे तक)
        if (shift === "Morning" && hours >= 12) {
            status.style.color = "red";
            status.innerText = "सुबह की हाजरी का समय (दोपहर 12 बजे तक) समाप्त हो चुका है!";
            return;
        }

        status.style.color = "green";
        status.innerText = `सफलतापूर्वक हाजरी दर्ज हुई! (${name} - ${shift} Shift)`;
    }
</script>

</body>
</html>
